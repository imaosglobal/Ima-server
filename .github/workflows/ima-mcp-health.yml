name: IMA MCP Health

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Start IMA server
        run: |
          node server.js > /tmp/ima-server.log 2>&1 &
          echo $! > /tmp/ima-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:${PORT:-3000}/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
      - name: MCP protocol smoke test
        env:
          IMA_MCP_URL: http://127.0.0.1:3000/mcp
        run: yarn test:mcp
      - name: Server log on failure
        if: failure()
        run: cat /tmp/ima-server.log
